<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A1224">
  <style>
    html, body { margin: 0; background: #1a1224; }
    #opening {
      position: fixed; inset: 0; z-index: 1; display: grid; place-content: center;
      justify-items: center; gap: 14px; padding: 24px; text-align: center;
      background: #1a1224; color: #fbf1df; font: 1rem/1.5 system-ui, sans-serif;
    }
    #opening p { margin: 0; }
    #opening .moon { width: 36px; height: 36px; border-radius: 50%; background: #f0d7a2; }
    #opening a { color: #fbf1df; padding: 12px 16px; }
  </style>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="An offline pregnancy companion with daily check-ins and a paper-cut nursery.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Little Bumpy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Little Bumpy</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="opening">
    <span class="moon" aria-hidden="true"></span>
    <p role="status" id="opening-status">Opening Little Bumpy…</p>
    <a id="opening-retry" href="./" hidden>Try again</a>
    <noscript>Enable JavaScript in this browser to open the app.</noscript>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: Little Bumpy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze

      - name: Content gate (banned words & approval status)
        run: flutter test test/unit/content_gate_test.dart --reporter=expanded

      - name: Verify offline web packaging
        run: python3 -B -m unittest discover -s tool -p test_offline_web.py

      - name: Verify paper portraits in Chrome
        run: python3 tool/test_web_portraits.py

      - name: Full test suite
        run: flutter test --reporter=expanded
